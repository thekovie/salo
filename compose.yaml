# Local development and the CI smoke test only. In production the app and PostgreSQL are two separate Coolify
# resources (see docs/deployment.md); never point Salo at Coolify's own database.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: salo
      POSTGRES_PASSWORD: salo
      POSTGRES_DB: salo
    ports:
      # Loopback only, on 5433 so it never collides with another local Postgres.
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salo -d salo"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://salo:salo@db:5432/salo
      APP_URL: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  db-data:
