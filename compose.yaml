# Local development and the CI smoke test only. In production the app and PostgreSQL are two separate Coolify
# resources (see docs/deployment.md); never point Salo at Coolify's own database.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: salo
      # Local/CI only, loopback-bound: no password.
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: salo
    ports:
      # Loopback only, on 5433 so it never collides with another local Postgres.
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salo -d salo"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    profiles: ["app", "proxy"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://salo@db:5432/salo
      # The address people use. Behind the local Traefik (profile "proxy") run with SALO_APP_URL=http://localhost:8080.
      APP_URL: ${SALO_APP_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:3000:3000"

  # Traefik, the proxy Coolify uses, in front of the app: checks that live updates stream through it unbuffered.
  proxy:
    image: traefik:v3.3
    profiles: ["proxy"]
    depends_on: [app]
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --log.level=WARN
    volumes:
      - ./ops/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    ports:
      - "127.0.0.1:8080:80"

volumes:
  db-data:
